<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CodeMate AI</title>
    <link rel="icon" type="image/png" href="/CodeMate_AI.png?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Identity Services - Phiên bản mới tương thích Chrome 136+ -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --primary-text-color: #e3e3e3;
            --secondary-text-color: #bdc1c6;
            --accent-color: #8ab4f8;
            --border-color: #3c4043;
            --error-bg-color: #f28b82;
            --error-text-color: #202124;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-box {
            background: var(--surface-color);
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
        }

        .login-header h1 {
            color: var(--accent-color);
            font-size: 28px;
            margin: 0 0 8px 0;
        }

        .login-header p {
            color: var(--secondary-text-color);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--primary-text-color);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--primary-text-color);
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input::placeholder {
            color: var(--secondary-text-color);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--secondary-text-color);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .google-signin-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 0 auto;
        }

        .google-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #333;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background 0.2s;
        }

        .google-btn:hover {
            background: #f8f9fa;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 24px;
            color: var(--secondary-text-color);
            font-size: 14px;
        }

        .toggle-mode a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(242, 139, 130, 0.2);
            color: var(--error-bg-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 3px solid var(--error-bg-color);
        }

        .success-message {
            background: rgba(129, 201, 149, 0.2);
            color: #81c995;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 3px solid #81c995;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--bg-color);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-code"></i>
                </div>
                <h1>CodeMate AI</h1>
                <p id="mode-title">Đăng nhập vào tài khoản của bạn</p>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <form id="auth-form">
                <div class="form-group" id="name-group" style="display: none;">
                    <label for="full-name">Họ và tên</label>
                    <input type="text" id="full-name" placeholder="Nhập họ và tên của bạn" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="email@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" required placeholder="Hãy nhập mật khẩu của bạn!" autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <span id="btn-text">Đăng nhập</span>
                </button>
            </form>

            <div class="divider">
                <span>HOẶC</span>
            </div>

            <!-- Google Sign-In Button -->
            <div class="google-signin-container">
                <div id="g_id_onload"
                     data-client_id="18633277470-dn4pk1979t9cs317fd4gsno1l9rb335b.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleSignIn"
                     data-auto_prompt="false">
                </div>
                
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left"
                     data-width="370">
                </div>
            </div>

            <div class="toggle-mode">
                <span id="toggle-text">Chưa có tài khoản?</span>
                <a href="#" id="toggle-link">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const fullNameInput = document.getElementById('full-name');
        const nameGroup = document.getElementById('name-group');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const modeTitle = document.getElementById('mode-title');
        const toggleText = document.getElementById('toggle-text');
        const toggleLink = document.getElementById('toggle-link');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        
        let isLoginMode = true;
        
        // Toggle giữa login và register
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            
            if (isLoginMode) {
                modeTitle.textContent = 'Đăng nhập vào tài khoản của bạn';
                btnText.textContent = 'Đăng nhập';
                toggleText.textContent = 'Chưa có tài khoản?';
                toggleLink.textContent = 'Đăng ký ngay';
                nameGroup.style.display = 'none';
                fullNameInput.removeAttribute('required');
            } else {
                modeTitle.textContent = 'Tạo tài khoản mới';
                btnText.textContent = 'Đăng ký';
                toggleText.textContent = 'Đã có tài khoản?';
                toggleLink.textContent = 'Đăng nhập';
                nameGroup.style.display = 'block';
                fullNameInput.setAttribute('required', 'required');
            }
            
            hideMessages();
        });
        
        // Xử lý submit form
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const fullName = fullNameInput.value.trim();
            
            if (!email || !password) {
                showError('Vui lòng điền đầy đủ thông tin');
                return;
            }
            
            if (!isLoginMode && !fullName) {
                showError('Vui lòng nhập họ và tên');
                return;
            }
            
            setLoading(true);
            hideMessages();
            
            try {
                const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
                const body = isLoginMode
                    ? { email, password }
                    : { email, password, full_name: fullName || email.split('@')[0] };
                
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (isLoginMode) {
                        showSuccess('Đăng nhập thành công! Đang chuyển hướng...');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        showSuccess('Đăng ký thành công! Vui lòng đăng nhập.');
                        setTimeout(() => {
                            toggleLink.click();
                            emailInput.value = email;
                            passwordInput.value = '';
                        }, 1500);
                    }
                } else {
                    showError(data.error || 'Có lỗi xảy ra. Vui lòng thử lại.');
                }
            } catch (error) {
                console.error('Auth error:', error);
                showError('Lỗi kết nối đến server. Vui lòng kiểm tra kết nối.');
            } finally {
                setLoading(false);
            }
        });
        
        // Callback cho Google Sign-In (Google Identity Services)
        window.handleGoogleSignIn = async (response) => {
            console.log('Google Sign-In callback triggered');
            
            if (!response.credential) {
                showError('Không nhận được thông tin từ Google');
                return;
            }
            
            setLoading(true);
            hideMessages();
            
            try {
                const res = await fetch(`${API_URL}/api/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential }),
                    credentials: 'include'
                });
                
                const data = await res.json();
                
                if (res.ok && data.user) {
                    showSuccess('Đăng nhập Google thành công! Đang chuyển hướng...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showError(data.error || 'Lỗi đăng nhập Google');
                }
            } catch (error) {
                console.error('Google login error:', error);
                showError('Lỗi kết nối đến server');
            } finally {
                setLoading(false);
            }
        };
        
        // Helper functions
        function setLoading(loading) {
            submitBtn.disabled = loading;
            if (loading) {
                btnText.innerHTML = '<span class="loading-spinner"></span> Đang xử lý...';
            } else {
                btnText.textContent = isLoginMode ? 'Đăng nhập' : 'Đăng ký';
            }
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }
        
        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }
        
        // Kiểm tra đã đăng nhập chưa
        (async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/api/auth/me`, { 
                    credentials: 'include' 
                });
                
                if (response.ok) {
                    const user = await response.json();
                    if (user.id) {
                        window.location.href = '/';
                    }
                }
            } catch (error) {
                console.log('Not logged in');
            }
        })();
    </script>
</body>
</html>
